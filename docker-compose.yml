networks:
  lakehouse-net:
    driver: bridge
volumes:
  postgres-data: null
  minio-data: null
  redpanda-data: null
services:
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    ports:
    - 5433:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - max_replication_slots=4
    - -c
    - max_wal_senders=4
    - -c
    - max_slot_wal_keep_size=1GB
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
    - lakehouse-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    hostname: redpanda
    restart: unless-stopped
    command:
    - redpanda
    - start
    - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
    - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
    - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    - --rpc-addr redpanda:33145
    - --advertise-rpc-addr redpanda:33145
    - --mode dev-container
    - --smp 1
    - --default-log-level=warn
    ports:
    - 19092:19092
    - 18082:18082
    - 18081:18081
    - 9644:9644
    volumes:
    - redpanda-data:/var/redpanda/data
    networks:
    - lakehouse-net
    healthcheck:
      test:
      - CMD
      - rpk
      - cluster
      - health
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    hostname: redpanda-console
    restart: unless-stopped
    ports:
    - 8088:8080
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: 'true'
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: 'true'
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
    - lakehouse-net
    deploy:
      resources:
        limits:
          memory: 256M
  minio:
    container_name: minio
    hostname: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
    - minio-data:/data
    networks:
      lakehouse-net:
        aliases:
        - lakehouse.minio
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    image: elestio/minio:latest
  debezium:
    image: quay.io/debezium/server:2.7
    container_name: debezium
    hostname: debezium
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    volumes:
    - ./debezium/application.properties:/debezium/conf/application.properties
    environment:
      JAVA_OPTS: -Xmx256m
    platform: linux/amd64
    networks:
    - lakehouse-net
    deploy:
      resources:
        limits:
          memory: 512M
  minio-init:
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
    - lakehouse-net
    entrypoint: /bin/sh -c " mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER}
      ${MINIO_ROOT_PASSWORD}; mc mb --ignore-existing myminio/lakehouse; echo 'MinIO
      lakehouse bucket verified.'; exit 0; "
    image: elestio/minio:latest
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    restart: unless-stopped
    ports:
    - 8081:8081
    command: jobmanager
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
    - ./flink/sql:/opt/flink/sql
    - ./core-site.xml:/opt/flink/conf/core-site.xml
    environment:
    - HADOOP_CONF_DIR=/opt/flink/conf
    - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    - 'FLINK_PROPERTIES=

      jobmanager.rpc.address: flink-jobmanager

      jobmanager.memory.process.size: 768m

      taskmanager.numberOfTaskSlots: 2

      parallelism.default: 1

      execution.checkpointing.mode: EXACTLY_ONCE

      execution.checkpointing.interval: 60s

      execution.checkpointing.min-pause: 30s

      execution.checkpointing.timeout: 120s

      state.backend.type: hashmap

      state.checkpoints.dir: s3a://lakehouse/checkpoints/flink

      restart-strategy.type: fixed-delay

      restart-strategy.fixed-delay.attempts: 3

      restart-strategy.fixed-delay.delay: 10s

      s3.endpoint: http://minio:9000

      s3.path.style.access: true

      s3.access-key: ${MINIO_ROOT_USER}

      s3.secret-key: ${MINIO_ROOT_PASSWORD}

      fs.s3a.endpoint: http://minio:9000

      fs.s3a.path.style.access: true

      fs.s3a.access.key: ${MINIO_ROOT_USER}

      fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD}

      fs.s3a.connection.ssl.enabled: false

      fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem

      fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

      fs.allowed-fallback-filesystems: s3a

      '
    networks:
    - lakehouse-net
    deploy:
      resources:
        limits:
          memory: 1024M
    image: custom-flink:1.20
  flink-taskmanager:
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
    volumes:
    - ./flink/sql:/opt/flink/sql
    - ./core-site.xml:/opt/flink/conf/core-site.xml
    environment:
    - HADOOP_CONF_DIR=/opt/flink/conf
    - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    - 'FLINK_PROPERTIES=

      jobmanager.rpc.address: flink-jobmanager

      taskmanager.memory.process.size: 1280m

      taskmanager.numberOfTaskSlots: 2

      parallelism.default: 1

      s3.endpoint: http://minio:9000

      s3.path.style.access: true

      s3.access-key: ${MINIO_ROOT_USER}

      s3.secret-key: ${MINIO_ROOT_PASSWORD}

      fs.s3a.endpoint: http://minio:9000

      fs.s3a.path.style.access: true

      fs.s3a.access.key: ${MINIO_ROOT_USER}

      fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD}

      fs.s3a.connection.ssl.enabled: false

      fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem

      fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

      fs.allowed-fallback-filesystems: s3a

      '
    networks:
    - lakehouse-net
    deploy:
      resources:
        limits:
          memory: 1536M
    image: custom-flink:1.20
  flink-sql-client:
    container_name: flink-sql-client
    hostname: flink-sql-client
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: sleep infinity
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    volumes:
    - ./flink/sql:/opt/flink/sql
    - ./core-site.xml:/opt/flink/conf/core-site.xml
    environment:
    - HADOOP_CONF_DIR=/opt/flink/conf
    - 'FLINK_PROPERTIES=

      jobmanager.rpc.address: flink-jobmanager

      rest.address: flink-jobmanager

      s3.endpoint: http://minio:9000

      s3.path.style.access: true

      s3.access-key: ${MINIO_ROOT_USER}

      s3.secret-key: ${MINIO_ROOT_PASSWORD}

      fs.s3a.endpoint: http://minio:9000

      fs.s3a.path.style.access: true

      fs.s3a.access.key: ${MINIO_ROOT_USER}

      fs.s3a.secret.key: ${MINIO_ROOT_PASSWORD}

      fs.s3a.connection.ssl.enabled: false

      fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem

      fs.s3a.aws.credentials.provider: org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

      fs.allowed-fallback-filesystems: s3a

      '
    networks:
    - lakehouse-net
    deploy:
      resources:
        limits:
          memory: 512M
    image: custom-flink:1.20
  polaris:
    image: apache/polaris:latest
    container_name: polaris
    hostname: polaris
    restart: unless-stopped
    ports:
    - 8181:8181
    environment:
    - POLARIS_BOOTSTRAP=true
    - AWS_REGION=us-east-1
    - AWS_DEFAULT_REGION=us-east-1
    - AWS_ACCESS_KEY_ID=minioadmin
    - AWS_SECRET_ACCESS_KEY=minioadmin123
    - POLARIS_FEATURES_SUPPORTED_STORAGE_TYPES=S3,FILE
    - JAVA_OPTS_APPEND=-Daws.accessKeyId=minioadmin -Daws.secretAccessKey=minioadmin123 -Daws.region=us-east-1 -Daws.sts.endpoint=http://minio:9000 -Daws.s3.endpoint=http://minio:9000 -Daws.endpointUrl=http://minio:9000 -Daws.endpointUrlSts=http://minio:9000 -Daws.endpointUrlS3=http://minio:9000 -Dsoftware.amazon.awssdk.endpoints.s3=http://minio:9000 -Dsoftware.amazon.awssdk.endpoints.sts=http://minio:9000 -Daws.s3.pathStyleAccessEnabled=true -Dsoftware.amazon.awssdk.s3.pathStyleAccessEnabled=true
    networks:
    - lakehouse-net
    depends_on:
    - minio
    deploy:
      resources:
        limits:
          memory: 512M
    platform: linux/amd64
  trino:
    image: trinodb/trino:latest
    container_name: trino
    hostname: trino
    restart: unless-stopped
    ports:
    - 8089:8080
    volumes:
    - ./trino/etc:/etc/trino
    networks:
    - lakehouse-net
    depends_on:
    - polaris
    - minio
    deploy:
      resources:
        limits:
          memory: 1024M
